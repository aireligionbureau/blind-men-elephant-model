name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install --no-deps --editable .

      - name: Compile Python sources
        run: python -m compileall -q src tools

      - name: Run the dependency-free test suite
        env:
          PYTHONPATH: src
        run: python tools/run_plain_tests.py

      - name: Audit cross-question isolation and real search fallback
        env:
          PYTHONPATH: src
        run: python tools/audit_cross_question_isolation.py
